[project]
name = "factify-backend"
version = "0.1.0"
description = "Factify — AI-based Fact-Check & Claim Verification System"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "httpx",
    "pydantic-settings",
    "python-dotenv",
    "python-socketio",
    "openai",
    "beautifulsoup4",
    "langchain",
    "langchain-openai",
    "langgraph",
    "tavily-python",
]

[tool.fastapi]
entrypoint = "app.main:app"
